[package]
name = "braim"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "braim"
path = "src/main.rs"

[features]
# Semantic similarity (braim similar / advisory dedup). Off by default so the
# base binary stays tiny and dependency-light; enable with
#   cargo build --release --features embeddings
# Pulls fastembed (ONNX MiniLM) via rustls — no system OpenSSL required.
embeddings = ["dep:fastembed"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tiny_http = "0.12"
fastembed = { version = "5", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"], optional = true }
