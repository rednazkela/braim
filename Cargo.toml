[package]
name = "braim"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "braim"
path = "src/main.rs"

[features]
# Semantic similarity (braim similar / audit --semantic / advisory dedup).
# ON by default: one canonical build, so installed binaries never diverge from
# the repo build in feature surface (two-build drift left a stale PATH binary
# missing newer commands). Opt out for a tiny dependency-light binary with
#   cargo build --release --no-default-features
# Pulls fastembed (ONNX MiniLM) via rustls — no system OpenSSL required.
default = ["embeddings"]
embeddings = ["dep:fastembed"]

[dev-dependencies]
# Integration tests link only against dev-dependencies, so the concurrency
# suite needs its own handle on serde_json to inspect central's files.
serde_json = "1"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tiny_http = "0.12"
fastembed = { version = "5", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"], optional = true }
