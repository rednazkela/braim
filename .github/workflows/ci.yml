name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The same three platforms the release matrix ships, so a break is caught
        # on the PR rather than at tag time. Windows and macOS build natively:
        # the embeddings feature links ONNX Runtime binaries that `ort` fetches
        # per host, which a Linux cross-build cannot supply (braim ID:267).
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

  # Pins the deeds-only rewording of model-facing text in hooks/ and
  # policies/ (session 2026-10-16): a pure grep, no model in the loop, so a
  # reintroduced extraction-shaped phrase ("reveal the chain of inferences",
  # "blocked until you comply", ...) fails the PR instead of waiting for the
  # next model generation to refuse it. See hooks/wording_lint.sh and
  # tests/prompt_fixtures/README.md for the fixture pair this complements.
  wording-lint:
    name: wording lint (model-facing text)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash hooks/wording_lint.sh

  # The dependency-light build is a supported configuration, so it must not rot.
  # Linux only — this checks that the feature gating still compiles, not platform
  # behaviour, which the matrix above already covers.
  no-default-features:
    name: build without embeddings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --no-default-features
      - run: cargo test --release --locked --no-default-features
